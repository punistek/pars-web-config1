name: Vavoo - 4 Saatlik M3U

on:
  schedule:
    # GitHub Actions cron UTC kullanir; her 4 saatte bir.
    - cron: '13 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vavoo-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Repo al
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt
      - name: Otomatik testler
        run: python -m unittest discover -s tests -v
      - name: Vavoo kanal listesini güncelle
        run: python vavoo_bot.py
      - name: Değişiklikleri yayınla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/vavoo.m3u output/vavoo.json output/turkiye.m3u output/turkiye.json output/url_changes.json output/status.json
          if git diff --staged --quiet; then
            echo 'Değişiklik yok.'
          else
            git commit -m 'Vavoo liste güncellemesi'
            git push
          fi
